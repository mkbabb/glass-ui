<!doctype html>
<!-- AM-W7-η — the demo dogfoods the published brand faces. The
     `brand-uniform-sans` typography preset is the canonical consumer opt-in
     (it's exactly what the speedtest consumer sets): it cascades
     `--font-display`/`--font-serif` from the library so the display/serif
     utilities resolve to the published Plus Jakarta Sans face that demo.css
     loads + maps via the `--font-brand-sans` override. No off-canon
     Fraunces / Computer Modern / Fontshare faces, no third-party CDN. -->
<html lang="en" data-typography-preset="brand-uniform-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Glassmorphic design system — Vue 3.5 components, glass tokens, motion primitives."
        />
        <link rel="icon" href="data:," />
        <title>glass-ui Feature Demo</title>

        <!-- Brand faces (Plus Jakarta Sans + Fira Code) are the PUBLISHED
             corpus — self-hosted woff2 loaded by demo.css's @font-face rules
             from `src/fonts/` (the same binaries the `./styles/fonts` export
             ships). No external font-host preconnect/stylesheet wiring is
             needed; the demo dogfoods exactly what a consumer of
             `@mkbabb/glass-ui/styles/fonts` receives. -->
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/demo/main.ts"></script>
    </body>
</html>
