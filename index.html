<!doctype html>
<!-- The demo dogfoods the library DEFAULT register with zero override. The
     library default IS the brand register (Plus Jakarta Sans text + display,
     Fira Code mono) — no typography preset, no sans-indirection token. What the
     demo renders is exactly what a consumer of the default tokens receives. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Glassmorphic design system — Vue 3.5 components, glass tokens, motion primitives."
        />
        <link rel="icon" href="data:," />
        <title>glass-ui Feature Demo</title>

        <!-- Brand faces (Plus Jakarta Sans + Fira Code) are the PUBLISHED
             corpus — self-hosted woff2 loaded by demo.css's @font-face rules
             from `src/fonts/` (the same binaries the `./styles/fonts` export
             ships). No external font-host preconnect/stylesheet wiring is
             needed; the demo dogfoods exactly what a consumer of
             `@mkbabb/glass-ui/styles/fonts` receives. -->

        <!-- BB.W-CSS-CRITICAL — the render-blocking /styles split loader recipe
             (the reference consumer pattern; the canon lives in CLAUDE.md
             §"Consumer wiring"). The CRITICAL subset (the token cascade + the
             5-rung glass ladder + typography + theme — the above-the-fold paint
             surface) loads render-blocking-EARLY; the DEFERRED tail (the
             component recipes + the SFC scoped payload + the components.css
             utility surface) loads NON-blocking via the `media="print"
             onload="this.media='all'"` swap idiom, so first paint is no longer
             gated on the long component-CSS tail. The deferred tail's late
             arrival shifts NO above-the-fold pixel (FOUC-safe by the
             byte-complete + boundary-design construction `proof:css-critical`
             asserts).

             The demo's DEV server bundles the library SOURCE cascade through
             demo.css (`@import "../src/styles/index.css"`, the union for HMR
             simplicity), so this split is the PRODUCTION-consumer reference:
             in a real consumer of the published package these two <link>s
             resolve `@mkbabb/glass-ui/styles/critical` + `…/styles/deferred`
             (built from this branch's `publishStyleAssets` two-subset emit),
             and the render-block win is measured under the W-LIGHTHOUSE
             production-preview protocol (see
             docs/tranches/BB/audit/visual/W-CSS-CRITICAL-DELTA.md). A consumer
             that wants one-import simplicity keeps the union
             `@mkbabb/glass-ui/styles` instead — the byte-complete union entry,
             NOT a back-compat alias.

        <link
            rel="stylesheet"
            href="<node_modules>/@mkbabb/glass-ui/dist/styles/critical.css"
        />
        <link
            rel="stylesheet"
            media="print"
            onload="this.media='all'"
            href="<node_modules>/@mkbabb/glass-ui/dist/styles/deferred.css"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="<node_modules>/@mkbabb/glass-ui/dist/styles/deferred.css"
            />
        </noscript>
        -->
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/demo/main.ts"></script>
    </body>
</html>
