<!doctype html>
<!-- The demo dogfoods the library DEFAULT register with zero override. The
     library default IS the brand register (Plus Jakarta Sans text + display,
     Fira Code mono) — no typography preset, no sans-indirection token. What the
     demo renders is exactly what a consumer of the default tokens receives. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Glassmorphic design system — Vue 3.5 components, glass tokens, motion primitives."
        />
        <link rel="icon" href="data:," />
        <title>glass-ui Feature Demo</title>

        <!-- Brand faces (Plus Jakarta Sans + Fira Code) are the PUBLISHED
             corpus — self-hosted woff2 loaded by demo.css's @font-face rules
             from `src/fonts/` (the same binaries the `./styles/fonts` export
             ships). No external font-host preconnect/stylesheet wiring is
             needed; the demo dogfoods exactly what a consumer of
             `@mkbabb/glass-ui/styles/fonts` receives. -->

        <!-- BG.W-CSS-MINIFY (F8.4) — the /styles cascade is the ONE byte-complete
             union entry `@mkbabb/glass-ui/styles` (the minified cascade). The
             BB.W-CSS-CRITICAL critical/deferred split loader recipe retired here:
             after the publish-time minify the ~13KB saving was not worth the
             split's wave + gate + manifest + two exports, so a consumer imports
             the single `@mkbabb/glass-ui/styles` entry. The demo's DEV server
             bundles the library SOURCE cascade through demo.css
             (`@import "../src/styles/index.css"`, the union for HMR simplicity). -->
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/demo/main.ts"></script>
    </body>
</html>
