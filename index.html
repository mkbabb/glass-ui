<!doctype html>
<!-- The demo dogfoods the library DEFAULT register with zero override. The
     library default IS the brand register (Plus Jakarta Sans text + display,
     Fira Code mono) — no typography preset, no sans-indirection token. What the
     demo renders is exactly what a consumer of the default tokens receives. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- `viewport-fit=cover` is the switch that makes `env(safe-area-inset-*)`
             resolve to anything but 0. Without it every `max(rung, env(...))` in the
             demo chassis computes the rung and the notch/home-indicator gutters are
             inert — the shell reads correct on a desktop and clips on a phone. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta
            name="description"
            content="Glassmorphic design system — Vue 3.5 components, glass tokens, motion primitives."
        />
        <link rel="icon" href="data:," />
        <title>glass-ui Feature Demo</title>

        <!-- Brand faces (Plus Jakarta Sans + Fira Code) are the PUBLISHED
             corpus — self-hosted woff2 from `src/fonts/` (the same binaries the
             `./styles/fonts` export ships). No external font-host
             preconnect/stylesheet wiring is needed; the demo dogfoods exactly
             what a consumer of `@mkbabb/glass-ui/styles/fonts` receives. -->
        <!-- What the first screen paints: Latin text in the text face on every
             route, and on a few (the home page, the tables, the metrics) figures
             or code in the code face. No first screen uses a Latin-ext character.
             So the two Latin faces are declared here. The text face is
             `font-display: optional`, used only if it has arrived by the first
             text layout (in Chromium, before rendering begins), so its load
             starts as the head is parsed. The code face is `swap`: a page whose
             first screen sets it is declared in its route row (`codeFace`), and
             the router renders that page once the face has loaded; elsewhere the
             face loads when code first appears. No preload: a preload is used
             only when its request mode matches the engine's own font request,
             `cors` in Chromium and `no-cors` in WebKit, so one preload tag is
             fetched twice by one engine or the other. The two Latin-ext faces
             stay in demo.css. -->
        <style>
            @font-face {
                font-family: "Plus Jakarta Sans";
                font-style: normal;
                font-weight: 200 800;
                font-display: optional;
                src: url("/src/fonts/plus-jakarta-sans/plus-jakarta-sans-latin.woff2")
                    format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                    U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Fira Code";
                font-style: normal;
                font-weight: 300 700;
                font-display: swap;
                src: url("/src/fonts/fira-code/fira-code-latin.woff2") format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                    U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
        </style>
        <script>
            document.fonts.load('1em "Plus Jakarta Sans"');
        </script>

        <!-- The /styles cascade is the one byte-complete union entry
             `@mkbabb/glass-ui/styles` (the minified cascade). The earlier
             critical/deferred split loader recipe retired here:
             after the publish-time minify the ~13KB saving was not worth the
             split's coordination and extra exports, so a consumer imports
             the single `@mkbabb/glass-ui/styles` entry. The demo's DEV server
             bundles the library SOURCE cascade through demo.css
             (`@import "../src/styles/index.css"`, the union for HMR simplicity). -->
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/demo/main.ts"></script>
    </body>
</html>
