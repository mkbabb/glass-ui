<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GOLDEN dock-core morph spike — ratio-free bounded morph + cartoon-punch + squash split</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     GOLDEN dock-core spike — proves the boldest mechanism in isolation:
       (1) ratio-FREE size: scale = lerp(collapsed,expanded)/expanded over a
           reserved `expanded` box → MONOTONIC + BOUNDED by construction.
       (2) the AUDACITY lives on a SEPARATE volume-preserving --squish channel
           (the cartoon-punch overshoot) — it deforms, never resizes.
       (3) --ease-cartoon-punch (DESIGN.md §Easing verbatim) carries anticipation.
     No measurement of the row is ever needed; clip aperture reveals a row laid
     out ONCE at natural width. cx pinned by center-origin scale.
     ───────────────────────────────────────────────────────────────────────── */

  @property --dock-t      { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --dock-squish { syntax: "<number>"; inherits: true; initial-value: 0; }

  :root {
    --motion-weight: 1;               /* dock pushes toward 1 (DESIGN.md §L4) */
    --ease-cartoon-punch: linear(0, -0.012, -0.038 33%, 0 42%, 0.62, 0.93,
                                 1.12, 1.22 66%, 1.18, 1.09, 1.02, 0.985,
                                 0.98, 0.99, 0.997, 1);
    --dock-collapsed-px: 60px;        /* the summary pill (content-derived) */
    --dock-dur: 0.66s;
    --warm-cream:  oklch(0.964 0.012 78);
    --warm-rim:    oklch(0.86 0.02 78);
    --ink:         oklch(0.30 0.02 78);
  }

  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;min-height:100vh;
    background: radial-gradient(120% 90% at 30% 20%, oklch(0.9 0.09 25), transparent 60%),
                radial-gradient(120% 90% at 80% 80%, oklch(0.88 0.10 250), transparent 60%),
                oklch(0.95 0.02 90);
    font:16px/1.4 system-ui,sans-serif;color:var(--ink);
  }

  /* the COLORFUL FIELD behind the glass (DESIGN.md §3) is the body gradient above */

  /* the dock root — auto-margin centered (the exact failing container) */
  .dock-wrap{ display:flex; justify-content:center; }

  .dock{
    /* the box RESERVES its expanded footprint (ONE layout solve). The visible
       size is a center-origin SCALE of a ratio-free blend — bounded [collapsed,
       expanded] by construction. */
    --dock-live: calc(
      var(--dock-collapsed-px) +
      (var(--dock-expanded-px, 240px) - var(--dock-collapsed-px)) * clamp(0, var(--dock-t), 1)
    );
    --dock-size-scale: calc(var(--dock-live) / var(--dock-expanded-px, 240px));

    /* the cartoon SQUISH — volume-preserving, vol along travel / pinch across.
       rides --dock-squish (cartoon-punch) × --motion-weight. CANNOT change size. */
    --s: calc(1 + 0.16 * var(--dock-squish) * var(--motion-weight));
    --sx: calc(var(--dock-size-scale) * var(--s));
    --sy: calc(1 / var(--s));

    inline-size: var(--dock-expanded-px, 240px);
    block-size: 60px;
    transform-origin: center center;
    scale: var(--sx) var(--sy);

    display:flex; align-items:center; justify-content:center;
    border-radius:9999px;
    background:
      linear-gradient(oklch(1 0 0 / 0.5), oklch(1 0 0 / 0.08)),
      var(--warm-cream);
    box-shadow:
      0 1px 0 oklch(1 0 0 / 0.7) inset,
      0 0 0 1px var(--warm-rim),
      6px 8px 0 0 oklch(0.30 0.02 78 / 0.10),     /* the cartoon cast (paper) */
      0 18px 40px oklch(0.30 0.02 78 / 0.18);
    backdrop-filter: blur(9px) saturate(1.4);
    overflow:clip;                                /* the iris aperture */
    white-space:nowrap;
    will-change: scale;
  }

  /* the content row — laid out ONCE at natural width behind the clip. NEVER measured. */
  .row{ display:flex; gap:10px; padding:0 14px; align-items:center; }
  .btn{
    width:40px;height:40px;border-radius:9999px;flex:0 0 auto;
    display:grid;place-items:center;
    background: var(--warm-cream);
    box-shadow: 0 0 0 1px var(--warm-rim), 0 1px 0 oklch(1 0 0 / 0.6) inset;
    /* children ride the SAME --dock-t through center-coupled reveal (no per-child width math) */
    --reveal: clamp(0, calc((var(--dock-t) - 0) / 0.55), 1);
    opacity: var(--reveal);
    scale: calc(0.82 + 0.18 * var(--reveal));
    transform-origin:center;
    font-size:18px;
  }
  /* the summary glyph is the only child visible at rest — center cell */
  .summary{ position:absolute; inset:0; display:grid; place-items:center; font-size:20px;
            opacity: calc(1 - clamp(0, var(--dock-t)*3, 1)); }

  /* PRM floor: --motion-weight 0, no anticipation, snap */
  @media (prefers-reduced-motion: reduce){
    :root{ --motion-weight:0; }
  }
</style>
</head>
<body>
  <div class="dock-wrap">
    <div class="dock" id="dock">
      <div class="summary">⌂</div>
      <div class="row">
        <div class="btn">⌂</div><div class="btn">◷</div><div class="btn">✦</div>
        <div class="btn">♡</div><div class="btn">⚙</div>
      </div>
    </div>
  </div>

<script type="module">
  const dock = document.getElementById('dock');

  // measure the expanded footprint ONCE (the ResizeObserver surface in prod).
  function measure(){
    const prev = dock.style.cssText;
    dock.style.setProperty('--dock-t','1');            // open so the row is at natural width
    dock.style.inlineSize='max-content';
    const w = Math.ceil(dock.getBoundingClientRect().width);
    dock.style.cssText = prev;
    dock.style.setProperty('--dock-expanded-px', w + 'px');
    return w;
  }
  measure();

  // a tiny spring-ish driver writing --dock-t through the cartoon-punch SHAPE.
  // (prod uses SpringProgress; here a CSS transition on the registered props gives
  //  the exact gestalt for the spike — anticipation via the punch easing.)
  dock.style.transition =
    '--dock-t var(--dock-dur) var(--ease-cartoon-punch), ' +
    '--dock-squish var(--dock-dur) var(--ease-cartoon-punch)';

  let open=false;
  function set(o){
    open=o;
    dock.style.setProperty('--dock-t', o?'1':'0');
    dock.style.setProperty('--dock-squish', o?'1':'0'); // punch deforms during travel
  }
  dock.addEventListener('pointerenter',()=>set(true));
  dock.addEventListener('pointerleave',()=>setTimeout(()=>{ if(!dock.matches(':hover')) set(false); },388));

  // ── the BORN-RED GATE: sample width + cx every frame across a programmatic
  //    expand, assert MONOTONIC non-decreasing + BOUNDED + cx pinned. ──────────
  window.__runGate = async function(){
    const samples=[];
    set(false); await new Promise(r=>setTimeout(r,50));
    const t0=performance.now(); set(true);
    await new Promise(res=>{
      function tick(){
        const r=dock.getBoundingClientRect();
        samples.push({t:performance.now()-t0, w:+r.width.toFixed(2), cx:+(r.left+r.width/2).toFixed(2)});
        if(performance.now()-t0 < 800) requestAnimationFrame(tick); else res();
      }
      requestAnimationFrame(tick);
    });
    const ws=samples.map(s=>s.w), cxs=samples.map(s=>s.cx);
    const expanded=parseFloat(getComputedStyle(dock).getPropertyValue('--dock-expanded-px'));
    let maxBack=0; for(let i=1;i<ws.length;i++) maxBack=Math.max(maxBack, ws[i-1]-ws[i]);
    const cxExc=Math.max(...cxs)-Math.min(...cxs);
    const maxW=Math.max(...ws);
    return {
      expanded, frames:samples.length,
      widthMonotonic: maxBack <= 2,        // never steps BACK >2px (no implode)
      maxBackstep:+maxBack.toFixed(2),
      widthBounded: maxW <= expanded + 4,  // never exceeds expanded footprint (no 2452px flash)
      maxWidth:+maxW.toFixed(2),
      cxPinned: cxExc <= 4,
      cxExcursion:+cxExc.toFixed(2),
      first:ws[0], last:ws[ws.length-1],
    };
  };
</script>
</body>
</html>
