<!doctype html>
<!--
  GOLDEN spike — de-risks the §L4 keystone: ANTICIPATION (a pre-dip below origin),
  the one thing a damped spring physically cannot express (monotone one-sided approach).
  Proves `--ease-cartoon-punch` (a shaped linear() with an explicit negative leg) really
  dips below rest, then overshoots past the spring ≤10% fence, then settles — on transform
  only (compositor-safe, Chrome AND Safari). Throwaway. Run on localhost; instrument reads
  the live transform each frame and asserts a true sub-zero anticipation dip.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cartoon-punch spike</title>
<style>
  :root {
    /* the GOLDEN cartoon curve — anticipate (dip < 0) → overshoot ~1.22 → settle.
       NOT a damped spring (would break the live overshoot ≤10% invariant + cannot dip). */
    --ease-cartoon-punch: linear(
      0, -0.012, -0.038 33%, 0 42%, 0.62, 0.93, 1.12, 1.22 66%,
      1.18, 1.09, 1.02, 0.985, 0.98, 0.99, 0.997, 1
    );
    --shadow-color: hsl(28 60% 18%); /* warm floor — NEVER raw black (BA.W-NO-GRAY) */
    --shadow-cartoon-md:
      -4px 3px 1px color-mix(in srgb, var(--shadow-color) 12%, transparent),
       0   4px 1px color-mix(in srgb, var(--shadow-color) 12%, transparent),
      -4px 4px 2px color-mix(in srgb, var(--shadow-color) 8%, transparent);
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 2rem;
    background: #f6efe6; /* warm cream — never gray */
    font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #3a2e22;
  }
  .stage { display: grid; gap: 1.5rem; place-items: center; }
  .card {
    width: 168px; height: 104px; border-radius: 13px; /* base·φ² ≈ √φ ladder rung */
    display: grid; place-items: center; font-weight: 600; letter-spacing: -0.01em;
    background: #fffaf2; box-shadow: var(--shadow-cartoon-md);
    transform: translateY(0);
    will-change: transform;
  }
  /* the punch: a 720ms cartoon-cel arrival on transform only */
  .card.go { animation: punch 720ms var(--ease-cartoon-punch) both; }
  @keyframes punch {
    /* travels from 90px below to rest; the curve's negative leg => a real pre-dip
       (the card pulls DOWN/back past its start before launching up) */
    from { transform: translateY(90px) scale(0.9); }
    to   { transform: translateY(0)    scale(1);   }
  }
  button {
    font: inherit; padding: 0.5rem 1.1rem; border-radius: 10px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--shadow-color) 30%, transparent);
    background: #fffaf2;
  }
  #out { font-variant-numeric: tabular-nums; white-space: pre; font-size: 13px;
         padding: 0.75rem 1rem; border-radius: 8px; background: #fffaf2;
         box-shadow: var(--shadow-cartoon-md); min-width: 22rem; }
  @media (prefers-reduced-motion: reduce) {
    .card.go { animation: none; transition: transform 200ms cubic-bezier(.4,0,.2,1); transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">PUNCH</div>
    <button id="run">replay punch</button>
  </div>
  <div id="out">click "replay punch" — instrument samples translateY each frame…</div>
<script>
  const card = document.getElementById('card');
  const out = document.getElementById('out');
  // Sample the live composited transform every frame; assert a TRUE anticipation
  // dip (translateY goes BELOW its 90px start before resolving toward 0) — the
  // proof a spring cannot replicate.
  function readY() {
    const m = new DOMMatrixReadOnly(getComputedStyle(card).transform);
    return m.m42; // translateY in px
  }
  function run() {
    card.classList.remove('go'); void card.offsetWidth; card.classList.add('go');
    const start = performance.now(); const ys = [];
    function frame(now) {
      ys.push(readY());
      if (now - start < 780) { requestAnimationFrame(frame); }
      else {
        const startY = 90, maxY = Math.max(...ys), minY = Math.min(...ys);
        const dippedBelowStart = maxY > startY + 1.0;   // went PAST/below the 90px start = anticipation
        const overshotPastRest = minY < -3;             // crossed above rest (negative px) = punch overshoot
        const settled = Math.abs(ys[ys.length - 1]) < 1.5;
        out.textContent =
          `frames sampled: ${ys.length}\n` +
          `start translateY: ${startY}px (further from rest = down)\n` +
          `max translateY (deepest anticipation): ${maxY.toFixed(1)}px\n` +
          `min translateY (peak overshoot past rest): ${minY.toFixed(1)}px\n` +
          `final translateY (settle): ${ys[ys.length-1].toFixed(2)}px\n\n` +
          `ANTICIPATION dip below start  : ${dippedBelowStart ? 'PASS ✓ (spring cannot do this)' : 'FAIL ✗'}\n` +
          `PUNCH overshoot past rest     : ${overshotPastRest ? 'PASS ✓ (~22%, past spring ≤10% fence)' : 'FAIL ✗'}\n` +
          `SETTLE to rest                : ${settled ? 'PASS ✓' : 'FAIL ✗'}`;
        window.__spikeResult = { dippedBelowStart, overshotPastRest, settled, maxY, minY };
      }
    }
    requestAnimationFrame(frame);
  }
  document.getElementById('run').addEventListener('click', run);
  run();
</script>
</body>
</html>
