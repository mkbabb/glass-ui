name: ci

# Browser-free by design: no Playwright install, no pixel-floor job. Every gate here runs
# on Node alone. The browser gates (the pixel floor, `npm run test:browser`) run on real
# hardware in `scripts/release.sh` before a tag is cut.
#
# `paths`: a push that touches only docs no gate reads skips CI. Gates DO read some docs
# (docs/canon, docs/design, docs/audits, the AP/BJ/BK tranche records, and every *.md
# outside docs/), so those paths stay triggering. A new gate that reads another docs path
# must add it here.
on:
    pull_request:
        branches: [master]
        paths:
            - "**"
            - "!docs/**"
            - "docs/canon/**"
            - "docs/design/**"
            - "docs/audits/**"
            - "docs/tranches/AP/**"
            - "docs/tranches/BJ/**"
            - "docs/tranches/BK/**"
    push:
        branches: [master]
        paths:
            - "**"
            - "!docs/**"
            - "docs/canon/**"
            - "docs/design/**"
            - "docs/audits/**"
            - "docs/tranches/AP/**"
            - "docs/tranches/BJ/**"
            - "docs/tranches/BK/**"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            # Depth 1: no gate reads history. comment-census reads HEAD's tree only.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            # gate:boot-graph's BUILD arm measures the demo's eager import graph off a
            # freshly built dist-demo/ and fails loud on a stale or absent one. The build
            # belongs in the test job, not in an `npm test` hook: a `pretest` would gate
            # the LIBRARY publish on the DEMO building.
            - run: npm run demo:dist:build
            # build FIRST: the dist byte gates (public-surface, backdrop-prefix arm (b))
            # are fail-loud and load-bearing — a test run without dist is not a pass.
            - run: npm run build
            - run: npm test
