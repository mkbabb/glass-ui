# O.W5 Lane E — PR-time gate matrix expansion.
# Predecessor: .github/workflows/lint.yml (K W4 Lane B; bundle-budget only).
# Renamed to ci.yml here per W5.md §Lane E "single source of truth" goal:
# every PR closes on the same gate matrix the release path runs.
#
# Gate matrix (matches release.sh post-W5 Lane B+D shape):
#   1. typecheck            — vue-tsc --noEmit
#   2. test                 — vitest run
#   3. build                — vite build (needed for verify-export-types + profile:budget)
#   4. verify-export-types  — subpath dts publication probe (L.W0 Lane III)
#   5. profile:budget       — bundle-budget enforcement (K W4 Lane B re-land)
#
# Fail-fast: `set -e` is implicit in `run:` steps; any non-zero exit aborts the job.

name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

jobs:
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - name: typecheck
              run: npm run typecheck
            - name: test
              run: npm run test
            - name: build
              run: npm run build
            - name: verify-export-types
              run: npm run verify-export-types
            - name: profile:budget
              env:
                  GLASS_UI_BUDGET_SKIP_BUILD: "1"
              run: npm run profile:budget
            # P.W4 Lane B (Pε-3): sibling-independent proof:* subset.
            # proof:consumers:build + proof:runtime are SKIPPED in CI because
            # they walk sibling `../<consumer>` paths that don't exist on the
            # GitHub Actions runner. The 3 included gates total ~3 s wall and
            # close the "did glass-ui's package surface drift?" question every
            # PR.
            - name: proof:package
              run: npm run proof:package
            - name: proof:theme
              run: npm run proof:theme
            # AS.W2b R3 — the emitted component-utility cascade (P9) must define
            # every custom prop it references (the `--spacing` base + the
            # Tailwind-owned defaults), carry the canonical `.rounded-panel`
            # rule, and ship zero `@layer base`. Reads the freshly-built
            # dist/styles/components.css (build step above is its prerequisite).
            - name: proof:components-css
              run: npm run proof:components-css
            - name: proof:consumers:static
              run: npm run proof:consumers:static
            - name: audit:stash
              run: npm run audit:stash
            # Q.W0 Lane C: cross-repo dev-resolution contract gate.
            # Checks publisher exports["."] 4-key shape + absence of hard dist/ aliases.
            # Sibling repos (keyframes.js, value.js, ...) do not exist on the GH Actions
            # runner, so the publisher checks for those repos are skipped gracefully.
            # The glass-ui publisher check (missing "default" terminal key) DOES run
            # and will fail until Q.W1 adds the key — at which point this gate turns green.
            - name: proof:resolution
              run: npm run proof:resolution
            # Q.W6 — phantom-class corpus-grep gate (invariants 32 + 33).
            # Greps every name in `.retired-classes.txt` across glass-ui's own
            # src/ + demo/ AND every @mkbabb/* consumer. Sibling consumer repos
            # do not exist on the GH Actions runner — their roots are skipped
            # gracefully (existsSync guard); the glass-ui src/+demo/ sweep DOES
            # run every PR and closes the "did a retired class leak back into
            # the substrate or its demo?" question.
            - name: proof:phantom-classes
              run: npm run proof:phantom-classes
            - name: proof:vt-names
              run: npm run proof:vt-names
            # AT.W6-dock-c — the dock VT/FLIP motion-parity static gate. Asserts
            # the native View-Transition path and the JS FLIP fallback consume
            # ONE source timing curve (--dock-resize-spring), so an identity
            # dock layer-swap morph is timing-identical per engine (retiring the
            # AQ.W6 --vt-ease fork). The runtime concurrency half (isTransitioning
            # A→B→A no-skip/no-queue) rides `npm run test`.
            - name: proof:dock-motion-parity
              run: npm run proof:dock-motion-parity
            # AU.W8 — the dock single-frame-origin gate. The PERCEPTUAL sibling of
            # the string-match proof:dock-opacity-lockstep: the FLIP fallback's layer
            # ref-swap (→ opacity) and the width set (→ morph) must share ONE rAF
            # frame origin (closing the useLayerTransition async fork). Static source
            # proof — the perceptual settle-probe rides the slides deck Playwright.
            - name: proof:dock-motion-single-source
              run: npm run proof:dock-motion-single-source
            # AU.W2 — the dock fade↔morph opacity-lockstep static gate (slides-F
            # P0, the "not iOS-smooth" report). Asserts the `.dock-layer{,-item-host}`
            # opacity transition rides the SAME `--dock-motion-resize` token the
            # container morph uses (a 0-frame settle, inside the ≤1-frame bar) and
            # the active layer's `visibility 0s` stays immediate. Sibling-free.
            # DEMOTED W8 → syntactic; the frame-origin sibling is proof:dock-motion-single-source.
            - name: proof:dock-opacity-lockstep
              run: npm run proof:dock-opacity-lockstep
            # AU.W8 — the reka-Tabs dock rail a11y contract. The mounted-dock vitest
            # asserts role=tablist/tab + aria-selected (NOT the hand-rolled
            # aria-pressed at DockLayerGroup.vue), roving tabindex (Arrow/Home/End),
            # the focus-ring class, keepOpen/release on tab focus, and the
            # inactive-pane aria-hidden (8 rendered-attr assertions).
            - name: proof:dock-a11y-contract
              run: npm run proof:dock-a11y-contract
            # AU.W8 — the dock role-vocabulary gate. Asserts the dock README is the
            # single source for the four <Role>Dock names + base primitives + the
            # canonical useDock* composable names, and records the two HEAD
            # re-groundings (useTouchGate stays general; DockTabButton kept). Bite:
            # delete a role from the README → RED.
            - name: proof:dock-vocabulary
              run: npm run proof:dock-vocabulary
            # AU.W8b — the dock.css split gate. Asserts the five-control family
            # (.dock-icon-button/.dock-tab-button/triggers/dark-mode-toggle) moved
            # to dock-controls.css, the shared :where() four-state contract STAYS
            # in dock.css (the import root), and index.css @imports dock-controls.
            # Bite: a surviving control rule in dock.css → RED.
            - name: proof:dock-css-split
              run: npm run proof:dock-css-split
            # AU.W8b — the design-idiom localization gate. Asserts no SFC smuggles
            # a token through a `text-[var(--…)]` / `shadow-[var(--…)]` arbitrary
            # wrap that bypasses the @theme layer (the cascade tokens.css →
            # theme.css → utilities.css → scoped is the gold standard; sole
            # allowlist: TabsTrigger --active-tab-color). Bite: re-inject one → RED.
            - name: proof:design-idiom-localization
              run: npm run proof:design-idiom-localization
            # AV.W16 TW8 — EXTENDS proof:design-idiom-localization with the modern
            # Tailwind v4 cohesion asserts: (a) no theme(colors.…) function sites,
            # (b) no registered-namespace var-wrap where the bridge mints the named
            # utility, (c) the dock/chassis @container context, (d) @theme scale
            # completeness (one bridge per duration/ease/blur/shadow primitive).
            - name: proof:tailwind-v4-idiom
              run: npm run proof:tailwind-v4-idiom
            # AU.W9 — the W9 overfitting bar. Asserts each LANDED W9 fold (prop/
            # subpath/composable) maps to ≥2 distinct consumer contexts OR carries
            # a correctness/hygiene tag, and every cited consumer resolves at HEAD
            # (in-repo relative + cross-repo absolute). BOOKed items are not
            # tallied. Bite: a 1-consumer untagged fold (or drop a real consumer)
            # → RED.
            - name: proof:au-w9-consumers
              run: npm run proof:au-w9-consumers
            # AT.W7-dock-c — the ι doc-rot sweep. Asserts every `custom/<dir>`
            # directory + every Dependencies-table package + every
            # `@mkbabb/glass-ui/<subpath>` CLAUDE.md cites RESOLVES at HEAD
            # (catches the `dock-group`/`sidebar` dir drift + the
            # `lucide-vue-next`→`@lucide/vue` reference rot). Sibling-free —
            # runs on the bare runner.
            - name: proof:doc-consistency
              run: npm run proof:doc-consistency
            # AU.W0 — the formalize + re-ground meta-gate. Asserts tranches/AU/
            # is the binding tranche (AU.md + PROGRESS.md), the three landed dock
            # SHAs (e906448/f0b0ffb/8e4cb9f) are ancestor-reachable from HEAD, the
            # "3 a11y asks" bundle label survives only in a decompose context,
            # every numbered ledger row carries a disposition (P-Inv 28), and the
            # W6-dock-b slot-ID collision is re-lettered. Sibling-free.
            - name: proof:au-w0-reground
              run: npm run proof:au-w0-reground
            # AU.W1 — the design-slice meta-gate. Asserts the three AU.W1 design
            # slices exist (blob-primitives · dock · color-gates), each cites its
            # AT.W1 origin + its HEAD delta, and the W1c slice is the gate-fleet
            # registry (every AU gate enumerated with a greening wave — inv-θ).
            - name: proof:au-w1-design
              run: npm run proof:au-w1-design
            # AU.W3 — the strict-templates KEYSTONE. checkUnknownProps:true across
            # the 3 tsconfigs makes a bogus prop on a glass-ui component a RED
            # typecheck (the silent-no-op class that seeded the AS.W7 dock bug);
            # the fixture asserts the diagnostic fires; zero @ts-expect-error.
            - name: proof:strict-templates
              run: npm run proof:strict-templates
            # AU.W3 — peer optionality is a derived fact of the root bundle
            # (optional IFF absent from dist/glass-ui.js & not core-substrate);
            # the dead optionalPeerDependencies field is deleted (P1).
            - name: proof:peer-optional
              run: npm run proof:peer-optional
            # AU.W3 — the vueuse-FREE root barrel (SOURCE-graph walk from
            # src/index.ts + DIST-floor grep). The DataTable + useTokenColor leaks
            # are closed; no @vueuse/core reaches the root barrel.
            - name: proof:vueuse-free-root
              run: npm run proof:vueuse-free-root
            # AU.W3 — supportsPostTask is WIRED (>=1 real caller) or DROPPED; no
            # exported orphan (P3 wire-before-retire).
            - name: proof:supportsPostTask-wired
              run: npm run proof:supportsPostTask-wired
            # AU.W4 — the Fraunces slipped-ship gate. Asserts every variation axis
            # typography.css references (WONK/SOFT) is carried by the shipped
            # display @font-face — verified against the woff2 fvar table, so a
            # silently-inert axis (the slip the campaign missed) is a hard fail.
            - name: proof:font-axes
              run: npm run proof:font-axes
            # AU.W5 — the /color runtime-JS leaf gates. color-acyclic: the leaf
            # imports value.js only (no component back-import) + value.js/src never
            # imports glass-ui (the published graph is a DAG). single-color-core:
            # no glass-ui source re-defines a value.js color primitive (ONE core);
            # the CSS token tier stays native (exempt — .css is not scanned).
            - name: proof:color-acyclic
              run: npm run proof:color-acyclic
            - name: proof:single-color-core
              run: npm run proof:single-color-core
            # AU.W6 — the frostShader.ts orphan deletion (P1 no-legacy). File-
            # absence + import-graph (NOT a name-grep, which is born-green on the
            # unfixed orphan-present state).
            - name: proof:frostShader-deleted
              run: npm run proof:frostShader-deleted
            # AU.W6 — the useWebGLCanvas substrate (DEC-AT-1). ONE webgl2 bootstrap
            # shared by aurora + the blob; the substrate bakes none of aurora's
            # quad/DPR/uniforms (the consumer-#2 assert proves it composes generically);
            # the 3-reason suspend model + demand-gate + the webglcontextrestored
            # robustness are present.
            - name: proof:webgl-substrate-single
              run: npm run proof:webgl-substrate-single
            # AU.W7 — the blob trio. value-free (the injected ColorResolver seam,
            # two-tier source+dist); no-value-default (a no-resolver mount throws
            # naming defaultBlobColorResolver, not a silent gray); space-gamma (the
            # DEC-AT-7 seam — the default resolver paints GAMMA, a shader linear-flip
            # must close with linearToSrgb).
            - name: proof:blob-value-free
              run: npm run proof:blob-value-free
            - name: proof:no-value-default
              run: npm run proof:no-value-default
            # AV.W3 — each NEW motion composable (useCountup/vReveal) tallies ≥2
            # RESOLVING-at-HEAD in-repo consumers; the slides fork is `pending`.
            - name: proof:motion-composables-consumer
              run: npm run proof:motion-composables-consumer
            # AV.W3 — the lifted/adopted motion composables consume the keyframes
            # LIGHT tier only (no value.js edge, no loadAnimationEngine/animate).
            - name: proof:motion-value-free
              run: npm run proof:motion-value-free
            - name: proof:blob-space-gamma
              run: npm run proof:blob-space-gamma
            # AV.W1 — aurora's linear LUT pipeline MUST close with a linearToSrgb()
            # OETF before fragColor (the un-converged-sibling of the blob's A5/A2
            # darkening trap; a linear-in without an OETF-out ships ~2.2× too dark).
            - name: proof:aurora-space-gamma
              run: npm run proof:aurora-space-gamma
            # AW.W5.1 — the in-shader OKLCh palette interpolation: spliced matrices
            # 1e-6, the turns-domain interpolateHue port 1e-6 (antipode + warm→cool
            # seeded), the OKLab/OKLCh midpoint chroma holds above linear-mix (the
            # muddy-midtone kill).
            - name: proof:aurora-oklch-interp
              run: npm run proof:aurora-oklch-interp
            # AW.W5.2 — the derive-color neon-seed gamut matrix: every harmony ×
            # easing × temperature stop in sRGB after gamutMapStop; deriveScene
            # returns an in-gamut palette + composed nuclei per mood.
            - name: proof:aurora-derive-gamut
              run: npm run proof:aurora-derive-gamut
            # AV.W2 — the aurora↔blob shared GLSL convergence: the OETF + the four
            # Ottosson mat3 literals + the FBM_ROT constant live ONCE in
            # procedural-color.glsl.ts; neither frag re-defines a chunk-owned
            # artefact (the OETF can never again diverge — the AV.W1 root cause).
            - name: proof:shader-shared-source
              run: npm run proof:shader-shared-source
            # AU.W7 — the 8-assertion CPU-equivalence: the metaball OKLCh shader-
            # color TS port matches value.js's exact Ottosson CPU result to 1e-6
            # (asymmetric witness #3a7bd5 catches a transpose / convenience-matrix
            # error, which would sit at ~1e-4). The OKLCh-linear flip closes with a
            # linearToSrgb OETF (no too-dark ship).
            - name: proof:blob-color-equivalence
              run: npm run proof:blob-color-equivalence
            # AV.W15 — the iOS-26 Liquid Glass token-evolution: the
            # --glass-edge-light rim + the quiet-rung saturate parity + the
            # content-aware under-shadow modifier + the @property --specular-*
            # regs + the pointer-anchored moving specular (reduced-motion-static
            # + var()-centred fallback + @supports-gated refraction garnish) +
            # the AA floors. Born RED, greened by the W15 token + specular folds.
            - name: proof:liquid-glass-tokens
              run: npm run proof:liquid-glass-tokens
            # AV.W10 — the storybook re-invention + font-canon gates: the demo
            # manifest matches the §1 11-category IA (storybook-ia), every story
            # file ↔ exactly one manifest row (no-orphan-demo-route), and every
            # font reference names a shipped face or a generic keyword (font-canon).
            - name: proof:storybook-ia
              run: npm run proof:storybook-ia
            - name: proof:no-orphan-demo-route
              run: npm run proof:no-orphan-demo-route
            - name: proof:font-canon
              run: npm run proof:font-canon
            # AS.W2 inv-θ — the lockfile registry-resolution drift guard (#177
            # cannot silently re-break npm ci) + the meta-gate asserting this
            # ci.yml step set matches scripts/gates.mjs exactly (the manifest is
            # the single source of truth; per-step visibility kept, drift fails).
            - name: proof:lockfile
              run: npm run proof:lockfile
            # AV.W14 — DI/orchestration/hygiene structure-locks.
            - name: proof:di-consistency
              run: npm run proof:di-consistency
            - name: proof:no-nested-import
              run: npm run proof:no-nested-import
            - name: proof:no-test-in-src
              run: npm run proof:no-test-in-src
            - name: proof:spring-tokens-synced
              run: npm run proof:spring-tokens-synced
            - name: proof:offscreen-pause
              run: npm run proof:offscreen-pause
            - name: proof:subpath-enumeration
              run: npm run proof:subpath-enumeration
            - name: proof:no-orphan-composable
              run: npm run proof:no-orphan-composable
            - name: proof:speedtest-boundary
              run: npm run proof:speedtest-boundary
            - name: proof:shadow-contract
              run: npm run proof:shadow-contract
            - name: proof:card-cartoon-consumers
              run: npm run proof:card-cartoon-consumers
            - name: gates:verify-ci
              run: npm run gates:verify-ci
