name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: npm run typecheck
            # gate:boot-graph's BUILD arm measures the demo's eager import graph off a
            # freshly built dist-demo/ and fails loud on a stale or absent one. The build
            # belongs in the test job, not in an `npm test` hook: a `pretest` would gate
            # the LIBRARY publish on the DEMO building.
            - run: npm run demo:dist:build
            - run: npm test
            - run: npm run build

    # The pixel floor. The device-free vitest oracles pass a BLACK aurora and a
    # FLOODED blob; this job mounts the real components on a real device, reads back
    # the composited pixels, and reads its verdict from the MACHINE REPORT (a piped
    # runner's exit status is tail's). BOTH legs run: the green leg alone would re-
    # create the hollow-gate class this job exists to cure, so the planted-defect leg
    # must prove the floors CAN fail — and fail on their own assertion.
    pixel-floor:
        needs: [verify]
        runs-on: ubuntu-latest
        env:
            CI: "true"
            # The runner has no GPU; pin the deterministic software rasterizer rather
            # than letting the backend resolve.
            PI_ANGLE: swiftshader
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # BLOB floor only. The aurora floor is GPU-gated, not CI-gated: on the
            # software rasterizer it never arms (180s timeout vs 22.8s green on Metal),
            # so running it here would gate on the runner's GPU instead of our paint.
            # It runs pre-tag on real hardware — see release.yml `pixel-floor-gpu`.
            - name: pixel floor (real render must be GREEN)
              run: npm -w tests-visual run gate:pixel-floor:ci
            - name: pixel floor self-test (planted defect must be RED)
              run: npm -w tests-visual run gate:pixel-floor:ci:planted
            - name: bank the machine reports (the captured DELTA is the PAIR)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pixel-floor-pi-reports
                  path: |
                      tests-visual/.cache/pi-report-*.json
                      tests-visual/.cache/aurora-*.png
