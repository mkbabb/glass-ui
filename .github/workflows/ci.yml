# O.W5 Lane E — PR-time gate matrix expansion.
# Predecessor: .github/workflows/lint.yml (K W4 Lane B; bundle-budget only).
# Renamed to ci.yml here per W5.md §Lane E "single source of truth" goal:
# every PR closes on the same gate matrix the release path runs.
#
# Gate matrix (matches release.sh post-W5 Lane B+D shape):
#   1. typecheck            — vue-tsc --noEmit
#   2. test                 — vitest run
#   3. build                — vite build (needed for verify-export-types + profile:budget)
#   4. verify-export-types  — subpath dts publication probe (L.W0 Lane III)
#   5. profile:budget       — bundle-budget enforcement (K W4 Lane B re-land)
#
# Fail-fast: `set -e` is implicit in `run:` steps; any non-zero exit aborts the job.

name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

jobs:
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - name: typecheck
              run: npm run typecheck
            - name: test
              run: npm run test
            - name: build
              run: npm run build
            - name: verify-export-types
              run: npm run verify-export-types
            - name: profile:budget
              env:
                  GLASS_UI_BUDGET_SKIP_BUILD: "1"
              run: npm run profile:budget
            # P.W4 Lane B (Pε-3): sibling-independent proof:* subset.
            # proof:consumers:build + proof:runtime are SKIPPED in CI because
            # they walk sibling `../<consumer>` paths that don't exist on the
            # GitHub Actions runner. The 3 included gates total ~3 s wall and
            # close the "did glass-ui's package surface drift?" question every
            # PR.
            - name: proof:package
              run: npm run proof:package
            - name: proof:theme
              run: npm run proof:theme
            # AS.W2b R3 — the emitted component-utility cascade (P9) must define
            # every custom prop it references (the `--spacing` base + the
            # Tailwind-owned defaults), carry the canonical `.rounded-panel`
            # rule, and ship zero `@layer base`. Reads the freshly-built
            # dist/styles/components.css (build step above is its prerequisite).
            - name: proof:components-css
              run: npm run proof:components-css
            - name: proof:consumers:static
              run: npm run proof:consumers:static
            - name: audit:stash
              run: npm run audit:stash
            # Q.W0 Lane C: cross-repo dev-resolution contract gate.
            # Checks publisher exports["."] 4-key shape + absence of hard dist/ aliases.
            # Sibling repos (keyframes.js, value.js, ...) do not exist on the GH Actions
            # runner, so the publisher checks for those repos are skipped gracefully.
            # The glass-ui publisher check (missing "default" terminal key) DOES run
            # and will fail until Q.W1 adds the key — at which point this gate turns green.
            - name: proof:resolution
              run: npm run proof:resolution
            # Q.W6 — phantom-class corpus-grep gate (invariants 32 + 33).
            # Greps every name in `.retired-classes.txt` across glass-ui's own
            # src/ + demo/ AND every @mkbabb/* consumer. Sibling consumer repos
            # do not exist on the GH Actions runner — their roots are skipped
            # gracefully (existsSync guard); the glass-ui src/+demo/ sweep DOES
            # run every PR and closes the "did a retired class leak back into
            # the substrate or its demo?" question.
            - name: proof:phantom-classes
              run: npm run proof:phantom-classes
            - name: proof:vt-names
              run: npm run proof:vt-names
            # AT.W6-dock-c — the dock VT/FLIP motion-parity static gate. Asserts
            # the native View-Transition path and the JS FLIP fallback consume
            # ONE source timing curve (--dock-resize-spring), so an identity
            # dock layer-swap morph is timing-identical per engine (retiring the
            # AQ.W6 --vt-ease fork). The runtime concurrency half (isTransitioning
            # A→B→A no-skip/no-queue) rides `npm run test`.
            - name: proof:dock-motion-parity
              run: npm run proof:dock-motion-parity
            # AU.W2 — the dock fade↔morph opacity-lockstep static gate (slides-F
            # P0, the "not iOS-smooth" report). Asserts the `.dock-layer{,-item-host}`
            # opacity transition rides the SAME `--dock-motion-resize` token the
            # container morph uses (a 0-frame settle, inside the ≤1-frame bar) and
            # the active layer's `visibility 0s` stays immediate. Sibling-free.
            - name: proof:dock-opacity-lockstep
              run: npm run proof:dock-opacity-lockstep
            # AT.W7-dock-c — the ι doc-rot sweep. Asserts every `custom/<dir>`
            # directory + every Dependencies-table package + every
            # `@mkbabb/glass-ui/<subpath>` CLAUDE.md cites RESOLVES at HEAD
            # (catches the `dock-group`/`sidebar` dir drift + the
            # `lucide-vue-next`→`@lucide/vue` reference rot). Sibling-free —
            # runs on the bare runner.
            - name: proof:doc-consistency
              run: npm run proof:doc-consistency
            # AU.W0 — the formalize + re-ground meta-gate. Asserts tranches/AU/
            # is the binding tranche (AU.md + PROGRESS.md), the three landed dock
            # SHAs (e906448/f0b0ffb/8e4cb9f) are ancestor-reachable from HEAD, the
            # "3 a11y asks" bundle label survives only in a decompose context,
            # every numbered ledger row carries a disposition (P-Inv 28), and the
            # W6-dock-b slot-ID collision is re-lettered. Sibling-free.
            - name: proof:au-w0-reground
              run: npm run proof:au-w0-reground
            # AU.W1 — the design-slice meta-gate. Asserts the three AU.W1 design
            # slices exist (blob-primitives · dock · color-gates), each cites its
            # AT.W1 origin + its HEAD delta, and the W1c slice is the gate-fleet
            # registry (every AU gate enumerated with a greening wave — inv-θ).
            - name: proof:au-w1-design
              run: npm run proof:au-w1-design
            # AU.W3 — the strict-templates KEYSTONE. checkUnknownProps:true across
            # the 3 tsconfigs makes a bogus prop on a glass-ui component a RED
            # typecheck (the silent-no-op class that seeded the AS.W7 dock bug);
            # the fixture asserts the diagnostic fires; zero @ts-expect-error.
            - name: proof:strict-templates
              run: npm run proof:strict-templates
            # AU.W3 — peer optionality is a derived fact of the root bundle
            # (optional IFF absent from dist/glass-ui.js & not core-substrate);
            # the dead optionalPeerDependencies field is deleted (P1).
            - name: proof:peer-optional
              run: npm run proof:peer-optional
            # AU.W3 — the vueuse-FREE root barrel (SOURCE-graph walk from
            # src/index.ts + DIST-floor grep). The DataTable + useTokenColor leaks
            # are closed; no @vueuse/core reaches the root barrel.
            - name: proof:vueuse-free-root
              run: npm run proof:vueuse-free-root
            # AU.W3 — supportsPostTask is WIRED (>=1 real caller) or DROPPED; no
            # exported orphan (P3 wire-before-retire).
            - name: proof:supportsPostTask-wired
              run: npm run proof:supportsPostTask-wired
            # AU.W4 — the Fraunces slipped-ship gate. Asserts every variation axis
            # typography.css references (WONK/SOFT) is carried by the shipped
            # display @font-face — verified against the woff2 fvar table, so a
            # silently-inert axis (the slip the campaign missed) is a hard fail.
            - name: proof:font-axes
              run: npm run proof:font-axes
            # AS.W2 inv-θ — the lockfile registry-resolution drift guard (#177
            # cannot silently re-break npm ci) + the meta-gate asserting this
            # ci.yml step set matches scripts/gates.mjs exactly (the manifest is
            # the single source of truth; per-step visibility kept, drift fails).
            - name: proof:lockfile
              run: npm run proof:lockfile
            - name: gates:verify-ci
              run: npm run gates:verify-ci
