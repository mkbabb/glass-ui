# K W4 Lane B — bundle-budget gate restoration (Rβ A13).
# I.W6 shipped this workflow at 63e29e4; v0.8.0 consolidation 5baceb5
# silently dropped it. Re-landed here per K W4 spec hard gate (b).

name: lint

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

jobs:
    bundle-budget:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci
            - run: NODE_OPTIONS=--max-old-space-size=8192 npm run build
            - run: GLASS_UI_BUDGET_SKIP_BUILD=1 npm run profile:budget
