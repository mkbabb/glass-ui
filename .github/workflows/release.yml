name: release

# LAWFUL TAG PATH: a `v*.*.*` tag MUST be minted by `scripts/release.sh` and by nothing
# else. That script is the ONLY place the AURORA pixel floor runs (on real hardware — the
# floor never arms on the ubuntu SwiftShader rasterizer this workflow runs on, per ASK-24),
# banking the paired green+planted pi-reports as the captured DELTA. This publish job runs
# on the tag push and does NOT (and cannot honestly) re-assert the aurora floor; a tag pushed
# WITHOUT release.sh ships an un-floored aurora silently. The robust in-CI receipt check
# (banked pi-report pair exists AND is content-stamped fresh vs the tagged aurora sources) is
# routed to the GATES band at P-CLOSE-BATTERY — see
# docs/tranches/BJ/formation/stability/TERMINAL-ROUTINGS.md §GESTALT-1 INC-2.
#
# [2026-09-22 · BK register wave N-5] TRUSTED PUBLISHING. The publish step is ready for npm's
# OIDC trusted publisher (npm >= 11.5.1; `id-token: write` is already granted). The owner's
# one web act finishes it: npmjs.com → @mkbabb/glass-ui → Settings → Trusted Publisher →
# GitHub Actions, with organization or user `mkbabb`, repository `glass-ui`, workflow
# filename `release.yml`, environment name left blank → Set up connection. npm tries OIDC
# before the token, so `NODE_AUTH_TOKEN` stays until the first OIDC publish succeeds; then
# the `NPM_TOKEN` secret is deleted and the `env:` line with it. Removing the token BEFORE
# the publisher is enabled breaks the next cut.
on:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: verify tag matches package version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1; }
            - name: typecheck
              run: npm run typecheck
            - name: build
              run: npm run build
            - name: verify packed package
              run: npm run verify:package
            # gate:boot-graph's BUILD arm measures a freshly built dist-demo/; the build
            # is a test-job step so `npm test` stays the library's own suite.
            - name: build the demo dist the boot-graph gate measures
              run: npm run demo:dist:build
            - name: test
              run: npm test
            # Trusted publishing needs npm >= 11.5.1. Node 24 ships 11.19.0 (measured
            # 2026-09-22); the range states the floor without taking npm 12 at a cut.
            - name: npm with OIDC trusted publishing
              run: npm install -g npm@^11.5.1 && npm --version
            - name: publish
              run: npm publish --ignore-scripts --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
