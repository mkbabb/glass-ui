# release — publish @mkbabb/glass-ui to npm on a v*.*.* tag.
#
# Trigger: a pushed tag matching v*.*.* (changesets Version-Packages merge, or
# hand-cut). Before publishing, the job re-runs the FULL release gate matrix as
# the `gates.mjs --run release` FILTER — inv-θ: local == ci == release derive
# from ONE manifest (scripts/gates.mjs), never a hand-curated list that drifts
# (the prior hand list had silently dropped proof:components-css, proof:lockfile,
# and proof:phantom-classes). A tag can therefore never ship an artifact the
# gate would reject. Sibling gates (proof:resolution, proof:phantom-classes,
# proof:consumers:static) skip-by-policy on the clean runner where the sibling
# repos are absent.
#
# Publish auth: the NPM_TOKEN repository secret (automation token, publish
# scope) + an OIDC id-token for npm provenance (`--provenance` attests the
# build to this repo/workflow). The publish step runs only on tag refs —
# push/PR never reach it.
name: release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm provenance via OIDC
        env:
            # profile:budget reuses the `build` gate's dist instead of rebuilding.
            GLASS_UI_BUDGET_SKIP_BUILD: "1"
        steps:
            - uses: actions/checkout@v4
              with:
                  # full history — proof:ay-final's cardinal-ledger sub-gates
                  # resolve capture/surface commits via `git log` (a shallow
                  # clone reads every DELTA as unresolvable → false RED).
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - name: verify tag matches package.json version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1; }
            - name: release gate matrix (gates.mjs --run release)
              run: node scripts/gates.mjs --run release
            - name: publish
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
